[project]
name = "nexus-monorepo"
version = "0.1.0"
description = "Project Nexus polyglot monorepo Python workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "services/nexus-api",
]

[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "RUF001", # Ambiguous Unicode characters
    "RUF012", # Mutable class attributes in Django model Meta
    "TC001",  # Move app imports into type-checking block
    "TC002",  # Move third-party imports into type-checking block
    "TC003",  # Move stdlib imports into type-checking block
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F841", "B018", "B011", "SIM300", "RUF059", "I001", "SIM102", "B008", "RUF012"]
"ops/**" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
