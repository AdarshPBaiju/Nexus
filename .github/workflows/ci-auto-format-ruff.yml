name: Auto Format & Ruff Fix

on:
  workflow_dispatch:
  push:
    branches: [development, 'feat/**', 'fix/**', 'chore/**', 'test/**']
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.ruff.toml'
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.ruff.toml'

permissions:
  contents: write

jobs:
  auto-format-ruff:
    name: Ruff Format & Fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Auto-Fix
        run: |
          ruff check --fix-only --exit-zero .

      - name: Ruff Format
        run: |
          ruff format .

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style(python): auto-format and ruff fix [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "Working tree is completely clean. No ruff formatting or lint changes needed."
          fi
