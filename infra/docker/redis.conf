# Project Nexus - Multi-Database Redis Topology Configuration
# Port: 6379
port 6379
databases 16

# Logical Database Allocation:
# DB 0: Celery Task Queues (q.*) & Django L2 Cache
# DB 1: Go Heavy Worker Asynq Queues (go:batch)
# DB 2: Django Channels / WebSocket Channel Layer
# DB 3: Rate Limiting & Ephemeral Session Tokens

# Persistence & Memory Eviction
maxmemory 512mb
maxmemory-policy volatile-lru
save 900 1
save 300 10
save 60 10000

# Security
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
