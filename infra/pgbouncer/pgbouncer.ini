[databases]
nexus_regional = host=postgres port=5432 dbname=nexus_regional auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# Critical: Transaction Pooling preserves SET LOCAL app.current_tenant_id per transaction
pool_mode = transaction
server_reset_query = DISCARD ALL

# Concurrency & Pool Budgets
max_client_conn = 500
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100

# Passthrough Parameters for Multi-Tenant Forced RLS & Django
track_extra_parameters = app.current_tenant_id, app.current_user_id, app.current_actor_type
ignore_startup_parameters = extra_float_digits, search_path
