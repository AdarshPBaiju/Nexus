[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-api"
version = "0.1.0"
description = "Project Nexus Core API and Domain Services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.0,<6.0",
    "celery>=5.4,<5.5",
    "orjson>=3.10,<3.11",
    "pydantic>=2.9,<3.0",
    "cryptography>=43.0,<44.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "RUF012", # Mutable class attributes in Django model Meta
    "TC001",  # Move app imports into type-checking block
    "TC002",  # Move third-party imports into type-checking block
    "TC003",  # Move stdlib imports into type-checking block
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["nexus"]
