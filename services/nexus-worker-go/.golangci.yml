run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 15

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
